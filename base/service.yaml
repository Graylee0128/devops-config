apiVersion: v1
kind: Service
metadata:
  name: devops-app
  labels:
    app.kubernetes.io/name: devops-app
spec:
  type: ClusterIP
  # selector 必須與 Deployment .spec.template.metadata.labels 完全一致，
  # 否則 `kubectl get endpoints devops-app` 會是 <none>（最常見的「服務起來卻連不到」）。
  selector:
    app.kubernetes.io/name: devops-app
  ports:
    - name: http
      port: 80
      targetPort: http     # 用 named port，容器改 port 時這裡不用跟著改
      protocol: TCP
