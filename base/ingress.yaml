apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-app
  labels:
    app.kubernetes.io/name: devops-app
spec:
  ingressClassName: nginx
  rules:
    # host 由各 overlay patch 覆寫
    - host: devops-app.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-app
                port:
                  name: http
