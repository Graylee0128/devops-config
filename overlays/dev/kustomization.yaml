apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devops-app-dev

resources:
  - ../../base

# dev 不由 CI 自動 bump，tag 手動釘選 —— 用來對照「自動化的 prod」與「人工的 dev」
images:
  - name: ghcr.io/graylee0128/devops-app
    newTag: bootstrap

replicas:
  - name: devops-app
    count: 1

patches:
  - path: patch-ingress.yaml
  - path: patch-resources.yaml
